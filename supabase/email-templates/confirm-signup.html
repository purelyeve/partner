<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:#f5f0e8;">
  <div style="font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:12pt;line-height:1.5;color:#1d201f;background:#f5f0e8;padding:32px;">
    <div style="max-width:560px;margin:0 auto;background:#fff;padding:32px;border:1px solid #e8dcc8;">
      <!-- width only — do not set height (mobile clients squash logos when both are fixed) -->
      <img src="https://partner-gules-zeta.vercel.app/brand/logo-black-on-white.png" alt="Purely Eve" width="200" style="display:block;margin:0 0 24px;border:0;outline:none;text-decoration:none;width:200px;max-width:100%;height:auto;" />
      <p style="font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;color:#aa7800;letter-spacing:0.15em;font-size:10pt;text-transform:uppercase;margin:0 0 8px;">Purely Eve</p>
      <h1 style="font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:18pt;font-weight:bold;color:#3a2108;margin:0 0 24px;">Confirm your Partner Portal email</h1>
      <p style="font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:12pt;line-height:1.5;margin:0 0 12px;">Thank you for registering with the Purely Eve Partner Portal.</p>
      <p style="font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:12pt;line-height:1.5;margin:0 0 12px;">Please confirm your email address to finish creating your account:</p>
      <p style="margin:28px 0;">
        <a href="{{ .ConfirmationURL }}" style="font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:12pt;background:#3a2108;color:#f5f0e8;padding:12px 20px;text-decoration:none;display:inline-block;">Confirm email</a>
      </p>
      <p style="font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:11pt;color:#794100;margin:0 0 12px;">If you did not register, you can ignore this message.</p>
      <p style="font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;margin-top:32px;font-size:10pt;color:#794100;">Purely Eve LLC · Partner Portal</p>
    </div>
  </div>
</body>
</html>
